plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { }

loom {
    mixin { defaultRefmapName = "bridge14-refmap.json" }
}

dependencies {
    // заглушки API Velocity/Guice/slf4j (исходники в stubs/): только для компиляции плагина, в jar не попадают
    compileOnly files('libs/velocity-stubs.jar')
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 17; it.options.encoding = 'UTF-8' }

java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }

// для разработки: выгрузить classpath (чтобы проверять компиляцию вне CI)
tasks.register('exportCp', Copy) {
    from configurations.compileClasspath
    into "$buildDir/cp"
}

// отдельный сервер-мост: java -jar Bridge0_14-server.jar
tasks.register('serverJar', Jar) {
    archiveFileName = 'Bridge0_14-server.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(sourceSets.main.output) {
        include 'com/geniiy/bridge14/pe/**'
        include 'com/geniiy/bridge14/proxy/**'
        include 'com/geniiy/bridge14/server/**'
        include 'bridge14/**'
        include 'velocity-plugin.json'
    }
    manifest { attributes('Main-Class': 'com.geniiy.bridge14.server.StandaloneServer') }
    dependsOn classes
}
tasks.register('botJar', Jar) {
    archiveFileName = 'ClaudeBot014.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(sourceSets.main.output) {
        include 'com/geniiy/bridge14/pe/**'
        include 'com/geniiy/bridge14/proxy/**'
        include 'com/geniiy/bridge14/bot/**'
    }
    manifest { attributes('Main-Class': 'com.geniiy.bridge14.bot.ClaudeBot') }
    dependsOn classes
}
build.dependsOn serverJar
build.dependsOn botJar
