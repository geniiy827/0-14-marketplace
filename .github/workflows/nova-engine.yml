name: Build NOVA Engine

on:
  push:
    branches: [nova-client]
    paths: ['nova-engine/**', '.github/workflows/nova-engine.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: sh nova-engine/tools/ci_build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Engine
          path: nova-engine/out/*.apk

      - name: Publish to release "engine-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: engine-latest
          name: NOVA Engine (latest build)
          prerelease: true
          files: nova-engine/out/*.apk
