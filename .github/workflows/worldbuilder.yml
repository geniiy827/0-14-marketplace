name: Build World Builder 0.14.3

on:
  push:
    branches: [main, worldbuilder-0.14]
    paths: ['worldbuilder/**', '.github/workflows/worldbuilder.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worldbuilder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build mod (+ unit tests)
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wb-buildlog-${{ github.run_number }}
          name: World Builder build log ${{ github.run_number }}
          files: worldbuilder/build.log
          prerelease: true
          make_latest: false

      - name: Rename jar
        run: cp build/libs/WorldBuilder-0.14.3-*[0-9].jar WorldBuilder-0.14.3-1.20.1.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldBuilder-0.14.3
          path: worldbuilder/WorldBuilder-0.14.3-1.20.1.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: worldbuilder-${{ github.run_number }}
          name: World Builder 0.14.3 (Fabric 1.20.1) — сборка ${{ github.run_number }}
          files: worldbuilder/WorldBuilder-0.14.3-1.20.1.jar
          make_latest: false
