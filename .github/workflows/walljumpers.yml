name: Build Wall Jumpers

on:
  push:
    branches: [main]
    paths: ['walljumpers/**', '.github/workflows/walljumpers.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: walljumpers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WallJumpers.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallJumpers
          path: walljumpers/WallJumpers.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: walljumpers-${{ github.run_number }}
          name: Wall Jumpers ${{ github.run_number }}
          files: walljumpers/WallJumpers.apk
          make_latest: false
