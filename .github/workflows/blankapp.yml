name: Build Placeholder

on:
  push:
    branches: [main]
    paths: ['blankapp/**', '.github/workflows/blankapp.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blankapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Placeholder.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Placeholder
          path: blankapp/Placeholder.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: placeholder-${{ github.run_number }}
          name: Placeholder ${{ github.run_number }}
          files: blankapp/Placeholder.apk
          make_latest: false
