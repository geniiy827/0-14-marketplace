plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // FTP / FTPS
    implementation "commons-net:commons-net:3.11.1"
    include "commons-net:commons-net:3.11.1"
    // SFTP
    implementation "com.github.mwiede:jsch:0.2.20"
    include "com.github.mwiede:jsch:0.2.20"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 17; it.options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }

test {
    useJUnitPlatform()
    systemProperty "wb.testWorlds", project.findProperty("wbTestWorlds") ?: ""
    systemProperty "wb.ftpTest", project.findProperty("wbFtpTest") ?: ""
}

loom {
    runs {
        client {
            vmArgs "-Dwb.autotest=" + (project.findProperty("wbAutotest") ?: "")
            programArgs "--width", "1440", "--height", "810"
        }
    }
}
