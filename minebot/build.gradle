plugins {
    id 'com.android.application'
}

android {
    namespace 'com.geniiy.minebot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.geniiy.minebot'
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
