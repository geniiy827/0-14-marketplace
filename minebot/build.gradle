plugins {
    id 'com.android.application'
}

android {
    namespace 'com.geniiy.minebot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.geniiy.minebot'
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
